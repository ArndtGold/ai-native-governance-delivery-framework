model = "gpt-6.1-sol"
model_reasoning_effort = "low"
model_provider = "openai"
forced_login_method = "chatgpt"
web_search = "disabled"
project_doc_max_bytes = 0
features.shell_tool = false
features.memories = false
features.multi_agent = false
features.apps = false
features.code_mode = false
features.code_mode_host = true
features.skip_host_skill_discovery = true
features.plugins = false
features.hooks = false
mcp_servers.agdf.command = "/usr/local/Cellar/node@22/22.22.3/bin/node"
mcp_servers.agdf.args = ["<ISOLATED_PATH>/node_modules/@agdf/mcp-server/bin/agdf-mcp.js","--surface","codex"]
mcp_servers.agdf.required = true
mcp_servers.agdf.enabled_tools = ["agdf_inspect","agdf_approve"]
mcp_servers.agdf.tools.agdf_inspect.approval_mode = "approve"
mcp_servers.agdf.tools.agdf_approve.approval_mode = "approve"