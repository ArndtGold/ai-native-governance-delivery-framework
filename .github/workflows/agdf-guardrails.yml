name: AGDF Guardrails

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Runtime, installer and test behavior is OS-specific (npm .cmd shims, path separators, symlink
    # rights); repository-wide contracts are not, so those steps run once, in the repository_checks lane.
    # Node 22 is the supported minimum and publish baseline; Node 24 is the additional LTS lane.
    name: verify (${{ matrix.os }}${{ matrix.node != 22 && format(', node {0}', matrix.node) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            repository_checks: true
          - os: windows-latest
            node: 22
            repository_checks: false
          - os: ubuntu-latest
            node: 24
            repository_checks: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Git must opt into long paths before materializing nested evidence fixtures on Windows.
      - name: Enable Windows Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pages/package-lock.json

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Verify maintenance and release-evidence contracts
        run: npm run test:maintenance-contracts

      - name: Check shell script syntax
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      # Integrity and compatibility checks consume the generated host payloads.
      - name: Prepare and verify release assets
        run: npm run build && npm --prefix packages/cli run release:prepare

      # The MCP lock packs file:../cli, so prepare its payload before installation.
      # Install before full-source fixtures and the CLI smoke suite consume the SDK.
      - name: Install MCP validation dependencies from checkout
        working-directory: packages/mcp-server
        run: npm ci --ignore-scripts

      - name: Verify runtime integrity
        run: node plugins/agdf/scripts/check-runtime-integrity.mjs

      - name: Verify community health contracts
        if: matrix.repository_checks
        run: npm run test:community-health && npm run check:community-health

      - name: Verify host compatibility fixtures and evidence contracts
        if: matrix.repository_checks
        run: npm run test:host-compatibility

      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs

      - name: Verify release package contents
        run: npm --prefix packages/cli run test:package-contents

      - name: Verify @agdf/cli package contents
        run: npm --prefix packages/cli/distribution/agdf run test:package

      - name: Verify control transactions and lock ownership
        run: npm --prefix packages/cli run test:run-step-transaction && npm --prefix packages/cli run test:run-lock

      - name: Verify AGDF delivery-map gate
        if: matrix.repository_checks
        run: node packages/cli/bin/create-agdf.js delivery-map --dir . --all-active

      - name: Verify versioned AGDF skill evaluations
        run: npm --prefix packages/cli run eval:skills

      - name: Verify @agdf/mcp-server package contents
        run: npm --prefix packages/mcp-server run test:package

      - name: Verify create-agdf package
        run: npm --prefix packages/cli run smoke-test

      - name: Verify agdf CLI package
        run: npm --prefix packages/cli/distribution/agdf run smoke-test

      - name: Install Pages dependencies
        if: matrix.repository_checks
        run: npm --prefix pages ci

      - name: Verify Pages
        if: matrix.repository_checks
        run: npm --prefix pages run check && npm --prefix pages run test:landing && npm --prefix pages run test:public-documents
