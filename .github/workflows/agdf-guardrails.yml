name: AGDF Guardrails

on:
  pull_request:
  push:
    branches:
      - "**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pages/package-lock.json

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Verify community health contracts
        run: npm run test:community-health && npm run check:community-health

      - name: Verify runtime integrity
        run: node plugin/scripts/check-runtime-integrity.mjs

      - name: Prepare and verify release assets
        run: npm --prefix create-agdf run release:prepare

      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/create-agdf/generated/plugins/agdf" node create-agdf/generated/plugins/agdf/scripts/check-runtime-integrity.mjs

      - name: Verify release package contents
        run: npm --prefix create-agdf run test:package-contents

      - name: Verify AGDF delivery-map gate
        run: node create-agdf/bin/create-agdf.js delivery-map --dir . --all-active

      - name: Verify versioned AGDF skill evaluations
        run: npm --prefix create-agdf run eval:skills

      - name: Verify create-agdf package
        run: npm --prefix create-agdf run smoke-test

      - name: Verify agdf CLI package
        run: npm --prefix agdf run smoke-test

      - name: Install Pages dependencies
        run: npm --prefix pages ci

      - name: Verify Pages
        run: npm --prefix pages run check && npm --prefix pages run test:landing && npm --prefix pages run test:public-documents
