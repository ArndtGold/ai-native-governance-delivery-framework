name: AGDF Guardrails

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    # Runtime, installer and test behavior is OS-specific (npm .cmd shims, path separators, symlink
    # rights); repository-wide contracts are not, so those steps run once, in the repository_checks lane.
    # Node 22 is the supported minimum and publish baseline; Node 24 is the additional LTS lane.
    name: verify (${{ matrix.os }}${{ matrix.node != 22 && format(', node {0}', matrix.node) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            repository_checks: true
          - os: windows-latest
            node: 22
            repository_checks: false
          - os: ubuntu-latest
            node: 24
            repository_checks: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      # Git must opt into long paths before materializing nested evidence fixtures on Windows.
      - name: Enable Windows Git long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            pages/package-lock.json

      - name: Verify checkout with shared local and CI plan
        run: node scripts/verify-ci.mjs --lane ${{ matrix.repository_checks && 'repository' || 'runtime' }}
