name: Refresh host compatibility evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-compatibility-evidence
  cancel-in-progress: false

jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.refresh.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install repository dependencies
        run: node scripts/verify-ci.mjs --stage dependencies
      - name: Prepare release payloads
        run: node scripts/verify-ci.mjs --profile prepare
      # file:../cli must contain its generated payload before npm packs it.
      - name: Install MCP validation dependencies from checkout
        run: node scripts/verify-ci.mjs --stage mcp-dependencies
      - name: Refresh only stale source evidence
        id: refresh
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { checkComparison, recordComparison } from './scripts/host-compatibility/run.mjs';
          const result = checkComparison();
          if (result.status === 'pass') {
            appendFileSync(process.env.GITHUB_OUTPUT, 'changed=false\n');
          } else {
            if (result.diagnostic !== 'source_snapshot_changed') throw new Error(result.diagnostic);
            await recordComparison();
            const snapshot = JSON.parse(readFileSync('docs/compatibility/evidence/snapshot.json', 'utf8'));
            execFileSync('git', ['add', '--', 'docs/compatibility', snapshot.observation_source.path]);
            appendFileSync(process.env.GITHUB_OUTPUT, 'changed=true\n');
          }
          JS
      - name: Verify fixtures and recorded evidence
        run: npm run test:host-compatibility && npm run compatibility:check
      - name: Verify community health
        run: npm run test:community-health && npm run check:community-health
      - name: Package evidence update
        if: steps.refresh.outputs.changed == 'true'
        run: |
          git diff --cached --check
          git diff --cached --binary > "$RUNNER_TEMP/compatibility-update.patch"
          test -s "$RUNNER_TEMP/compatibility-update.patch"
      - name: Preserve verified evidence update
        if: steps.refresh.outputs.changed == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: host-compatibility-update
          path: ${{ runner.temp }}/compatibility-update.patch
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: record
    if: needs.record.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # This job publishes a checked patch; it never runs the fixture/build suite with write access.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: host-compatibility-update
          path: ${{ runner.temp }}/host-compatibility-update
      - name: Create or update evidence PR and start its checks
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_BASE_SHA: ${{ github.sha }}
          EVIDENCE_PATCH: ${{ runner.temp }}/host-compatibility-update/compatibility-update.patch
        run: bash scripts/host-compatibility/publish-update.sh
