name: Publish AGDF packages
permissions:
  contents: read
on:
  push:
    tags:
      - agdf-v*
jobs:
  codex-e2e:
    uses: ./.github/workflows/codex-release-e2e.yml
    secrets:
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Verify release workflow contract
        run: npm --prefix packages/cli run test:release-workflows
      - name: Verify release tag matches package versions
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          CREATE_AGDF_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/package.json', 'utf8')).version")"
          MCP_SERVER_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/mcp-server/package.json', 'utf8')).version")"
          MCP_CREATE_AGDF_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/mcp-server/package.json', 'utf8')).dependencies['create-agdf']")"
          AGDF_CLI_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/distribution/agdf/package.json', 'utf8')).version")"
          AGDF_CLI_CREATE_AGDF_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/distribution/agdf/package.json', 'utf8')).dependencies['create-agdf']")"
          EXPECTED_TAG="agdf-v${CREATE_AGDF_VERSION}"

          if [ "${TAG_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Tag ${TAG_NAME} does not match ${EXPECTED_TAG}" >&2
            exit 1
          fi

          if [ "${AGDF_CLI_VERSION}" != "${CREATE_AGDF_VERSION}" ]; then
            echo "@agdf/cli version ${AGDF_CLI_VERSION} does not match create-agdf version ${CREATE_AGDF_VERSION}" >&2
            exit 1
          fi

          if [ "${MCP_SERVER_VERSION}" != "${CREATE_AGDF_VERSION}" ]; then
            echo "@agdf/mcp-server version ${MCP_SERVER_VERSION} does not match create-agdf version ${CREATE_AGDF_VERSION}" >&2
            exit 1
          fi

          if [ "${MCP_CREATE_AGDF_VERSION}" != "${CREATE_AGDF_VERSION}" ]; then
            echo "@agdf/mcp-server depends on create-agdf@${MCP_CREATE_AGDF_VERSION}, expected ${CREATE_AGDF_VERSION}" >&2
            exit 1
          fi

          if [ "${AGDF_CLI_CREATE_AGDF_VERSION}" != "${CREATE_AGDF_VERSION}" ]; then
            echo "@agdf/cli depends on create-agdf@${AGDF_CLI_CREATE_AGDF_VERSION}, expected ${CREATE_AGDF_VERSION}" >&2
            exit 1
          fi
      - name: Verify runtime-free source and plugin metadata
        run: node plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Prepare and verify release assets
        run: npm run build && npm --prefix packages/cli run release:prepare
      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Verify versioned AGDF skill evaluations
        run: npm --prefix packages/cli run eval:skills
      - name: Verify registry-state classification
        run: npm --prefix packages/cli run test:release-registry-state
      - name: Install MCP validation dependencies from checkout
        working-directory: packages/mcp-server
        run: npm ci --ignore-scripts
      - name: Run @agdf/cli smoke test
        run: npm --prefix packages/cli/distribution/agdf run smoke-test
      - name: Verify create-agdf package contents
        run: npm --prefix packages/cli run test:package-contents
      - name: Verify @agdf/cli package contents
        run: npm --prefix packages/cli/distribution/agdf run test:package
      - name: Verify @agdf/mcp-server package contents
        run: npm --prefix packages/mcp-server run test:package
    timeout-minutes: 10
  claude-evidence:
    name: Validate Windows Claude evidence
    needs: codex-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Prepare the candidate independently of returned evidence
        run: npm ci --ignore-scripts && node scripts/verify-ci.mjs --profile prepare && node scripts/native-probes/release-evidence.mjs candidate --output .release-candidate.json
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: codex-release-*
          path: .release-evidence
      - name: Require all native Codex and Windows Claude observations
        run: node scripts/native-probes/release-evidence.mjs validate --candidate .release-candidate.json --directory .release-evidence --all-hosts
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - validate
      - codex-e2e
      - claude-evidence
      - tests
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Require publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for the coupled AGDF publish" >&2; exit 1; }
      - name: Check exact registry versions before publishing
        run: node scripts/release-registry-state.mjs --preflight
      - name: Prepare and verify release assets
        run: npm run build && npm --prefix packages/cli run release:prepare
      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Verify create-agdf package contents
        run: npm --prefix packages/cli run test:package-contents
      - name: Publish create-agdf to npm
        working-directory: dist/npm/create-agdf
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  tests:
    uses: ./.github/workflows/verify-agdf.yml
    with:
      scope: linux
  wait-create-agdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Wait for create-agdf readiness
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/package.json', 'utf8')).version")"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          NPM_ERROR_LOG="$(mktemp)"
          trap 'rm -f "${NPM_ERROR_LOG}"' EXIT

          wait_for_npm_package() {
            local PACKAGE="$1"
            LAST_ERROR=""
            for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
              if RESULT="$(npm view "${PACKAGE}@${VERSION}" version --json 2>"${NPM_ERROR_LOG}")"; then
                RESOLVED_VERSION="$(node -e "const value = JSON.parse(process.argv[1]); process.stdout.write(String(value));" "${RESULT}")"
                if [ "${RESOLVED_VERSION}" = "${VERSION}" ]; then
                  echo "${PACKAGE}@${VERSION} is resolvable on npm."
                  LAST_ERROR=""
                  break
                fi
                LAST_ERROR="resolved ${RESOLVED_VERSION}, expected ${VERSION}"
              else
                LAST_ERROR="$(cat "${NPM_ERROR_LOG}")"
              fi

              if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                sleep "${SLEEP_SECONDS}"
              fi
            done

            if [ -n "${LAST_ERROR}" ]; then
              echo "Timed out waiting for ${PACKAGE}@${VERSION} after ${MAX_ATTEMPTS} attempts. Last error: ${LAST_ERROR}" >&2
              exit 1
            fi
          }

          wait_for_npm_package "create-agdf"
        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "10000"
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  verify-published-mcp:
    needs: wait-create-agdf
    uses: ./.github/workflows/verify-agdf.yml
    with:
      scope: linux
      suite: mcp
      published: true
  publish-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify-published-mcp
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Require publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for the coupled AGDF publish" >&2; exit 1; }
      - name: Prepare and verify release assets
        run: npm run build && npm --prefix packages/cli run release:prepare
      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Verify create-agdf package contents
        run: npm --prefix packages/cli run test:package-contents
      - name: Publish @agdf/mcp-server to npm
        working-directory: dist/npm/agdf-mcp-server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  wait-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-mcp
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Wait for @agdf/mcp-server readiness
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/mcp-server/package.json', 'utf8')).version")"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          NPM_ERROR_LOG="$(mktemp)"
          trap 'rm -f "${NPM_ERROR_LOG}"' EXIT
          LAST_ERROR=""
          for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
            if RESULT="$(npm view "@agdf/mcp-server@${VERSION}" version --json 2>"${NPM_ERROR_LOG}")"; then
              RESOLVED_VERSION="$(node -e "const value = JSON.parse(process.argv[1]); process.stdout.write(String(value));" "${RESULT}")"
              if [ "${RESOLVED_VERSION}" = "${VERSION}" ]; then
                echo "@agdf/mcp-server@${VERSION} is resolvable on npm."
                LAST_ERROR=""
                break
              fi
              LAST_ERROR="resolved ${RESOLVED_VERSION}, expected ${VERSION}"
            else
              LAST_ERROR="$(cat "${NPM_ERROR_LOG}")"
            fi
            if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then sleep "${SLEEP_SECONDS}"; fi
          done
          if [ -n "${LAST_ERROR}" ]; then
            echo "Timed out waiting for @agdf/mcp-server@${VERSION} after ${MAX_ATTEMPTS} attempts. Last error: ${LAST_ERROR}" >&2
            exit 1
          fi
        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "10000"
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  publish-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: wait-mcp
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Require publish credential
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for the coupled AGDF publish" >&2; exit 1; }
      - name: Prepare and verify release assets
        run: npm run build && npm --prefix packages/cli run release:prepare
      - name: Verify built plugin integrity
        run: AGDF_RUNTIME_INTEGRITY_ROOT="$GITHUB_WORKSPACE/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Verify create-agdf package contents
        run: npm --prefix packages/cli run test:package-contents
      - name: Publish @agdf/cli to npm
        working-directory: dist/npm/agdf
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  wait-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: publish-wrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Wait for @agdf/cli readiness
        shell: bash
        run: |+
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/distribution/agdf/package.json', 'utf8')).version")"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          NPM_ERROR_LOG="$(mktemp)"
          trap 'rm -f "${NPM_ERROR_LOG}"' EXIT

          wait_for_npm_package() {
            local PACKAGE="$1"
            LAST_ERROR=""
            for ATTEMPT in $(seq 1 "${MAX_ATTEMPTS}"); do
              if RESULT="$(npm view "${PACKAGE}@${VERSION}" version --json 2>"${NPM_ERROR_LOG}")"; then
                RESOLVED_VERSION="$(node -e "const value = JSON.parse(process.argv[1]); process.stdout.write(String(value));" "${RESULT}")"
                if [ "${RESOLVED_VERSION}" = "${VERSION}" ]; then
                  echo "${PACKAGE}@${VERSION} is resolvable on npm."
                  LAST_ERROR=""
                  break
                fi
                LAST_ERROR="resolved ${RESOLVED_VERSION}, expected ${VERSION}"
              else
                LAST_ERROR="$(cat "${NPM_ERROR_LOG}")"
              fi

              if [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; then
                sleep "${SLEEP_SECONDS}"
              fi
            done

            if [ -n "${LAST_ERROR}" ]; then
              echo "Timed out waiting for ${PACKAGE}@${VERSION} after ${MAX_ATTEMPTS} attempts. Last error: ${LAST_ERROR}" >&2
              exit 1
            fi
          }

          wait_for_npm_package "@agdf/cli"

        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "10000"
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  wait-wrapper-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: wait-wrapper
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Wait for @agdf/cli latest readiness
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/distribution/agdf/package.json', 'utf8')).version")"
          MAX_ATTEMPTS=20
          SLEEP_SECONDS=15
          NPM_ERROR_LOG="$(mktemp)"
          trap 'rm -f "${NPM_ERROR_LOG}"' EXIT

          MAX_LATEST_ATTEMPTS=20
          LATEST_VERSION=""
          LAST_LATEST_ERROR=""
          for ATTEMPT in $(seq 1 "${MAX_LATEST_ATTEMPTS}"); do
            if RESULT="$(npm view "@agdf/cli@latest" version --json 2>"${NPM_ERROR_LOG}")"; then
              LATEST_VERSION="$(node -e "const value = JSON.parse(process.argv[1]); process.stdout.write(String(value));" "${RESULT}")"
              if [ "${LATEST_VERSION}" = "${VERSION}" ]; then
                echo "@agdf/cli@latest resolves to ${VERSION}."
                LAST_LATEST_ERROR=""
                break
              fi
              LAST_LATEST_ERROR="resolved ${LATEST_VERSION}, expected ${VERSION}"
            else
              LAST_LATEST_ERROR="$(cat "${NPM_ERROR_LOG}")"
            fi

            if [ "${ATTEMPT}" -lt "${MAX_LATEST_ATTEMPTS}" ]; then
              sleep "${SLEEP_SECONDS}"
            fi
          done

          if [ -n "${LAST_LATEST_ERROR}" ]; then
            echo "Timed out waiting for @agdf/cli@latest to resolve to ${VERSION} after ${MAX_LATEST_ATTEMPTS} attempts. Last error: ${LAST_LATEST_ERROR}" >&2
            exit 1
          fi
        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "10000"
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: wait-wrapper-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install checkout dependencies
        run: npm ci --ignore-scripts
      - name: Run clean public bootstrap smoke test
        run: AGDF_EXPECTED_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('./packages/cli/distribution/agdf/package.json', 'utf8')).version")" node ./packages/cli/scripts/release-bootstrap-smoke-test.js
      - name: Confirm all exact registry versions
        run: node scripts/release-registry-state.mjs --complete
      - name: Report exact registry state after failure
        if: failure()
        run: node scripts/release-registry-state.mjs --report
