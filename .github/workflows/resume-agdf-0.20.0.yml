name: Complete AGDF 0.20.0 publication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-agdf-0.20.0
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - id: plan
        run: echo "matrix=$(node scripts/ci-plan.mjs --matrix true --scope linux --suite mcp)" >> "$GITHUB_OUTPUT"
  verify:
    needs: plan
    name: Published ${{ matrix.graphLabel }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out immutable release sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: &source-checkout
          ref: agdf-v0.20.0
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: Check out repaired CI tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: &tooling-checkout
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Run the complete original MCP partition with locked SDK preparation
        env:
          CI_JOB: ${{ matrix.id }}
        run: node tooling/scripts/release/verify-tagged-mcp.mjs "$CI_JOB" source
  publish-mcp:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *source-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *tooling-checkout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Require green CI for the repair commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPAIR_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for ATTEMPT in $(seq 1 30); do
            RESULT=$(gh run list --workflow agdf-guardrails.yml --commit "$REPAIR_SHA" --limit 1 --json status,conclusion)
            STATE=$(node -e 'const [r]=JSON.parse(process.argv[1]); console.log(!r || r.status !== "completed" ? "pending" : r.conclusion)' "$RESULT")
            if [ "$STATE" = success ]; then exit 0; fi
            if [ "$STATE" != pending ]; then echo "Repair CI failed: $STATE" >&2; exit 1; fi
            sleep 10
          done
          echo "Repair CI has not completed successfully" >&2
          exit 1
      - name: Build and validate unchanged tagged payloads
        working-directory: source
        run: npm ci --ignore-scripts && npm run build && npm --prefix packages/cli run release:prepare && AGDF_RUNTIME_INTEGRITY_ROOT="$PWD/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs
      - name: Install locked MCP package test dependencies
        working-directory: source
        run: node ../tooling/scripts/release/install-published-mcp.mjs
      - name: Verify MCP package and exact packed stdio smoke
        working-directory: source
        run: npm --prefix packages/mcp-server run test:package
      - name: Publish only missing MCP package after exact source and create-agdf byte verification
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tooling/scripts/release/resume-0200.mjs publish-mcp source
  publish-wrapper:
    needs: publish-mcp
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *source-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *tooling-checkout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build and validate unchanged tagged payloads
        working-directory: source
        run: npm ci --ignore-scripts && npm run build && npm --prefix packages/cli run release:prepare && AGDF_RUNTIME_INTEGRITY_ROOT="$PWD/packages/cli/generated/plugins/agdf" node packages/cli/generated/plugins/agdf/scripts/check-runtime-integrity.mjs && npm --prefix packages/cli/distribution/agdf run test:package
      - name: Publish only missing CLI package after exact source and create-agdf byte verification
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node tooling/scripts/release/resume-0200.mjs publish-wrapper source
  bootstrap:
    needs: publish-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *source-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: *tooling-checkout
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify all exact package versions and latest
        run: node tooling/scripts/release/resume-0200.mjs complete source
      - name: Run current clean public bootstrap smoke test against the published release
        env:
          AGDF_EXPECTED_VERSION: 0.20.0
        run: node tooling/packages/cli/scripts/release-bootstrap-smoke-test.js
