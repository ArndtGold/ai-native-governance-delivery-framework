<svg xmlns="http://www.w3.org/2000/svg" width="680" height="860" viewBox="0 0 680 860" role="img" aria-labelledby="title desc">
  <title id="title">Kompakte Entscheidung ohne wiederholte Aufforderungen</title>
  <desc id="desc">Eine schmale Anforderungskarte zeigt konkrete Frage, geänderte Meldung, Scope, Vorprüfungsgrenze, Zustimmungswirkung und eine Hauptaktion. Vollständige Quellen bleiben erreichbar.</desc>
  <style>
    .bg {fill:#f6f6f6} .card {fill:#fcfcfc;stroke:#d8dada;stroke-width:1.5}
    .soft {fill:#f1f3f3} .effect {fill:#e8f5f3}
    .title {fill:#202327;font:700 26px Inter,Arial,sans-serif}
    .heading {fill:#25272a;font:700 22px Inter,Arial,sans-serif}
    .meta {fill:#66686a;font:400 14px Inter,Arial,sans-serif}
    .body {fill:#3c3e40;font:400 16px Inter,Arial,sans-serif}
    .strong {fill:#25272a;font:700 16px Inter,Arial,sans-serif}
    .label {fill:#0f766e;font:700 15px Inter,Arial,sans-serif}
    .button {fill:#0f766e} .buttonText {fill:white;font:700 16px Inter,Arial,sans-serif}
    .link {fill:#0f766e;font:700 15px Inter,Arial,sans-serif}
  </style>
  <rect class="bg" width="680" height="860"/>
  <text class="title" x="32" y="44">Eine Frage, eine verfügbare Hauptaktion</text>
  <text class="meta" x="32" y="73">Schmale MCP-App · qualifizierter Klickweg als Zielzustand</text>
  <g transform="translate(100 106)">
    <rect class="card" width="480" height="700" rx="16"/>
    <text class="meta" x="24" y="36">Anmeldung verbessern · Anforderung, Fassung 2</text>
    <text class="heading" x="24" y="78">Soll bei falschen Zugangsdaten</text>
    <text class="heading" x="24" y="108">diese Meldung erscheinen?</text>
    <text class="strong" x="24" y="150">„E-Mail oder Passwort ist nicht korrekt“</text>
    <text class="body" x="24" y="184">Für die Anmeldung im Kundenportal.</text>
    <text class="body" x="24" y="208">Außerhalb: Passwort-Reset und Registrierung.</text>
    <rect class="soft" x="20" y="232" width="440" height="112" rx="12"/>
    <text class="label" x="36" y="260">Geändert seit Fassung 1</text>
    <text class="body" x="36" y="286">Deine gewünschte Meldung ist übernommen.</text>
    <text class="body" x="36" y="310">Umfang unverändert; bisher keine Freigabe.</text>
    <text class="meta" x="36" y="331">Grundlage: Vergleich der beiden Fassungen</text>
    <text class="body" x="24" y="378">Entwurf geprüft · Fassung 2 · ohne Befund.</text>
    <text class="body" x="24" y="404">Nur Autorenregeln; fachliche Entscheidung offen.</text>
    <text class="body" x="24" y="430">Implementierung und Tests sind noch nicht erfolgt.</text>
    <rect class="effect" x="20" y="452" width="440" height="76" rx="12"/>
    <text class="body" x="36" y="480">Danach: System untersuchen, Ablauf bestimmen.</text>
    <text class="strong" x="36" y="506">Umsetzung bleibt gesperrt.</text>
    <rect class="button" x="24" y="550" width="252" height="48" rx="8"/>
    <text class="buttonText" x="44" y="581">Anforderung bestätigen</text>
    <text class="link" x="24" y="632">Anforderung und Vergleich ansehen</text>
    <text class="link" x="24" y="660">Änderung besprechen · Diese Fassung ablehnen</text>
    <text class="meta" x="24" y="684">› Prüfbericht, Herkunft und technische Bindung</text>
  </g>
  <text class="meta" x="32" y="840">Erfundene Beispieldaten · v3 · dieselbe UR-Beispielbindung wie im Begleitdokument</text>
</svg>
