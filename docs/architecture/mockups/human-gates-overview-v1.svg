<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">Gemeinsames Kartenmodell für die sechs menschlichen AGDF-Gates</title>
  <desc id="desc">Sechs Karten zeigen die verständliche Aufgabe, Entscheidungsfrage, Mindestinhalte, Wirkung und exakte Chat-Antwort für UR, PRD, SD, TP, QA und UAT.</desc>
  <style>
    .canvas { fill: #f6f6f6; }
    .card { fill: #fcfcfc; stroke: #d8dada; stroke-width: 2; }
    .summary { fill: #f3f4f4; }
    .effectBox { fill: #e8f5f3; }
    .eyebrow { fill: #0f766e; font: 700 16px Inter, Arial, sans-serif; letter-spacing: .5px; }
    .gate { fill: #66686a; font: 700 15px "JetBrains Mono", Consolas, monospace; }
    .heading { fill: #25272a; font: 700 26px Inter, Arial, sans-serif; }
    .status { fill: #66686a; font: 400 16px Inter, Arial, sans-serif; }
    .question { fill: #25272a; font: 700 20px Inter, Arial, sans-serif; }
    .body { fill: #3c3e40; font: 400 16px Inter, Arial, sans-serif; }
    .effect { fill: #185e58; font: 700 15px Inter, Arial, sans-serif; }
    .button { fill: #0f766e; }
    .buttonText { fill: #ffffff; font: 700 15px Inter, Arial, sans-serif; }
    .link { fill: #0f766e; font: 700 15px Inter, Arial, sans-serif; }
    .pageTitle { fill: #202327; font: 700 34px Inter, Arial, sans-serif; }
    .pageSubtitle { fill: #66686a; font: 400 18px Inter, Arial, sans-serif; }
    .footer { fill: #66686a; font: 400 14px Inter, Arial, sans-serif; }
  </style>

  <rect class="canvas" width="1600" height="1120"/>
  <text class="pageTitle" x="40" y="52">Ein Kartenmodell für alle menschlichen Gates</text>
  <text class="pageSubtitle" x="40" y="82">Gleiche Bindung und Bedienlogik, gate-spezifische Entscheidungsinhalte</text>

  <g transform="translate(30 110)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">ZIEL UND UMFANG KLÄREN</text>
    <text class="gate" x="635" y="32">UR</text>
    <text class="heading" x="24" y="66">Haben wir deinen Wunsch richtig verstanden?</text>
    <text class="status" x="24" y="94">Fassung 2 · Entscheidung ausstehend · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Ziel: Klare Meldung bei falschen Zugangsdaten.</text>
    <text class="body" x="36" y="169">Umfang: Anmeldung; außerhalb: Reset und Registrierung.</text>
    <text class="body" x="36" y="196">Offene Klärungen: keine.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: Brownfield Review und Routenwahl · Umsetzung bleibt gesperrt</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="55" y="301">Anforderung lesen</text>
    <text class="link" x="238" y="301">So stimmt es</text>
    <text class="gate" x="532" y="301">Approval: UR</text>
  </g>

  <g transform="translate(820 110)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">VERHALTEN FESTLEGEN</text>
    <text class="gate" x="620" y="32">PRD</text>
    <text class="heading" x="24" y="66">Soll das Ergebnis so funktionieren?</text>
    <text class="status" x="24" y="94">Fassung 1 · Entscheidung ausstehend · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Verhalten: Fehlermeldung direkt am Anmeldeformular.</text>
    <text class="body" x="36" y="169">Kriterien: AC-001 bis AC-003 vollständig und testbar.</text>
    <text class="body" x="36" y="196">Produktentscheidungen und UX-Auswirkungen: geklärt.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: Lösungsentwurf erstellen · Umsetzung bleibt gesperrt</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="55" y="301">Verhalten lesen</text>
    <text class="link" x="238" y="301">So stimmt es</text>
    <text class="gate" x="520" y="301">Approval: PRD</text>
  </g>

  <g transform="translate(30 440)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">LÖSUNG PLANEN</text>
    <text class="gate" x="635" y="32">SD</text>
    <text class="heading" x="24" y="66">Ist dieser Lösungsweg passend?</text>
    <text class="status" x="24" y="94">Fassung 1 · Entscheidung ausstehend · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Architektur: bestehenden Auth-Fehlerpfad erweitern.</text>
    <text class="body" x="36" y="169">Owner, Wiederverwendung und Schnittstellen: benannt.</text>
    <text class="body" x="36" y="196">Alternativen, Risiken und Fallbacks: nachvollziehbar.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: Task- und Testplan erstellen · Umsetzung bleibt gesperrt</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="66" y="301">Lösung lesen</text>
    <text class="link" x="238" y="301">So stimmt es</text>
    <text class="gate" x="532" y="301">Approval: SD</text>
  </g>

  <g transform="translate(820 440)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">UMSETZUNGSSCHRITTE PRÜFEN</text>
    <text class="gate" x="635" y="32">TP</text>
    <text class="heading" x="24" y="66">Trägt dieser Plan die vereinbarte Lösung?</text>
    <text class="status" x="24" y="94">Fassung 1 · Entscheidung ausstehend · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Aufgaben T-01 bis T-04 decken Kriterien und Design ab.</text>
    <text class="body" x="36" y="169">Tests, Nachweise, Reihenfolge und Owner sind festgelegt.</text>
    <text class="body" x="36" y="196">Bekannte Risiken besitzen Kontrolle und Exit-Kriterium.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: Brownfield Analysis · Umsetzung erst nach deren Pass</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="72" y="301">Plan lesen</text>
    <text class="link" x="238" y="301">So stimmt es</text>
    <text class="gate" x="532" y="301">Approval: TP</text>
  </g>

  <g transform="translate(30 770)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">QUALITÄT ENTSCHEIDEN</text>
    <text class="gate" x="635" y="32">QA</text>
    <text class="heading" x="24" y="66">Sind Qualität und Nachweise ausreichend?</text>
    <text class="status" x="24" y="94">QA-Bericht · technische Entscheidung: PASS · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Tests und Evals: bestanden · Reviews: abgeschlossen.</text>
    <text class="body" x="36" y="169">Offene Blocker: 0 · Restgrenzen: dokumentiert.</text>
    <text class="body" x="36" y="196">Abweichungsannahme: nicht erforderlich.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: UAT vorbereiten · Release bleibt gesperrt</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="50" y="301">QA-Bericht lesen</text>
    <text class="link" x="238" y="301">Freigeben</text>
    <text class="gate" x="532" y="301">Approval: QA</text>
  </g>

  <g transform="translate(820 770)">
    <rect class="card" width="750" height="310" rx="18"/>
    <text class="eyebrow" x="24" y="32">ERGEBNIS ABNEHMEN</text>
    <text class="gate" x="620" y="32">UAT</text>
    <text class="heading" x="24" y="66">Erfüllt das Ergebnis deinen Wunsch?</text>
    <text class="status" x="24" y="94">Abnahmefassung · Entscheidung ausstehend · Du bist dran</text>
    <rect class="summary" x="20" y="112" width="710" height="104" rx="12"/>
    <text class="body" x="36" y="142">Geliefert: vereinbartes Verhalten und Nachweise.</text>
    <text class="body" x="36" y="169">Nicht geliefert: Release und automatische VCS-Aktionen.</text>
    <text class="body" x="36" y="196">Restrisiken und akzeptierte QA-Abweichungen: sichtbar.</text>
    <rect class="effectBox" x="20" y="226" width="710" height="40" rx="10"/>
    <text class="effect" x="36" y="251">Danach: OR und Closeout · kein automatischer Release</text>
    <rect class="button" x="24" y="276" width="190" height="38" rx="8"/>
    <text class="buttonText" x="48" y="301">Ergebnis ansehen</text>
    <text class="link" x="238" y="301">Abnehmen</text>
    <text class="gate" x="520" y="301">Approval: UAT</text>
  </g>

  <text class="footer" x="40" y="1104">Semantischer Architektur-Mock · Beispielinhalt · keine native Hostqualifizierung</text>
</svg>
