<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc">
  <title id="title">Dieselbe UR-Entscheidung in großer App, kompakter App und Portable Markdown</title>
  <desc id="desc">Drei Produkt-Mocks zeigen denselben gebundenen Entscheidungsgegenstand mit qualifiziertem nativen Klick, unqualifiziertem Chatweg und vollständigem Portable-Markdown-Fallback.</desc>
  <style>
    .bg { fill: #f6f6f6; }
    .card { fill: #fcfcfc; stroke: #d8dada; stroke-width: 2; }
    .soft { fill: #f1f3f3; }
    .effect { fill: #e8f5f3; }
    .markdown { fill: #202327; }
    .title { fill: #202327; font: 700 34px Inter, Arial, sans-serif; }
    .subtitle { fill: #66686a; font: 400 18px Inter, Arial, sans-serif; }
    .section { fill: #0f766e; font: 700 17px Inter, Arial, sans-serif; letter-spacing: .5px; }
    .heading { fill: #25272a; font: 700 26px Inter, Arial, sans-serif; }
    .compactHeading { fill: #25272a; font: 700 22px Inter, Arial, sans-serif; }
    .status { fill: #66686a; font: 400 16px Inter, Arial, sans-serif; }
    .body { fill: #3c3e40; font: 400 17px Inter, Arial, sans-serif; }
    .strong { fill: #25272a; font: 700 17px Inter, Arial, sans-serif; }
    .effectText { fill: #185e58; font: 700 16px Inter, Arial, sans-serif; }
    .button { fill: #0f766e; }
    .buttonText { fill: #ffffff; font: 700 16px Inter, Arial, sans-serif; }
    .link { fill: #0f766e; font: 700 16px Inter, Arial, sans-serif; }
    .mono { fill: #d9f4ef; font: 600 16px "JetBrains Mono", Consolas, monospace; }
    .monoStrong { fill: #ffffff; font: 700 17px "JetBrains Mono", Consolas, monospace; }
    .mdHeading { fill: #ffffff; font: 700 25px "JetBrains Mono", Consolas, monospace; }
    .mdBody { fill: #e4e7e7; font: 400 16px "JetBrains Mono", Consolas, monospace; }
    .footer { fill: #66686a; font: 400 14px Inter, Arial, sans-serif; }
  </style>

  <rect class="bg" width="1200" height="1220"/>
  <text class="title" x="40" y="50">Eine Entscheidung, drei Hostzustände</text>
  <text class="subtitle" x="40" y="80">Run, Gate, Revision, Inhalt und Folgen bleiben identisch</text>

  <text class="section" x="40" y="120">GROSSE MCP-APP · NATIVER KLICK QUALIFIZIERT</text>
  <g transform="translate(40 140)">
    <rect class="card" width="1120" height="330" rx="20"/>
    <text class="section" x="30" y="38">ZIEL UND UMFANG KLÄREN</text>
    <text class="heading" x="30" y="76">Haben wir deinen Wunsch richtig verstanden?</text>
    <text class="status" x="30" y="106">Fassung 2 · Entscheidung ausstehend · Du bist dran</text>
    <rect class="soft" x="26" y="130" width="1068" height="92" rx="14"/>
    <text class="body" x="48" y="162">Ziel: Klare Meldung bei falschen Zugangsdaten.</text>
    <text class="body" x="48" y="192">Im Umfang: Anmeldung · außerhalb: Passwort-Reset und Registrierung.</text>
    <rect class="effect" x="26" y="236" width="1068" height="42" rx="10"/>
    <text class="effectText" x="48" y="263">Danach: Brownfield Review und Routenwahl · Umsetzung bleibt gesperrt</text>
    <rect class="button" x="30" y="292" width="170" height="44" rx="9"/>
    <text class="buttonText" x="67" y="320">So stimmt es</text>
    <text class="link" x="230" y="320">Anforderung lesen</text>
    <text class="status" x="824" y="320">› Technische Bindung</text>
  </g>

  <text class="section" x="40" y="520">KOMPAKTE MCP-APP · KLICK NOCH NICHT QUALIFIZIERT</text>
  <g transform="translate(40 540)">
    <rect class="card" width="535" height="600" rx="20"/>
    <text class="section" x="26" y="40">ZIEL UND UMFANG KLÄREN</text>
    <text class="compactHeading" x="26" y="78">Haben wir deinen Wunsch</text>
    <text class="compactHeading" x="26" y="106">richtig verstanden?</text>
    <text class="status" x="26" y="136">Fassung 2 · Entscheidung ausstehend</text>
    <rect class="soft" x="22" y="158" width="491" height="154" rx="14"/>
    <text class="strong" x="42" y="190">Du bist dran</text>
    <text class="body" x="42" y="220">Prüfe Ziel und Umfang.</text>
    <text class="body" x="42" y="250">Ziel: klare Fehlermeldung.</text>
    <text class="body" x="42" y="280">Außerhalb: Reset und Registrierung.</text>
    <rect class="effect" x="22" y="326" width="491" height="64" rx="12"/>
    <text class="effectText" x="42" y="354">Danach: System untersuchen</text>
    <text class="body" x="42" y="378">Umsetzung bleibt gesperrt.</text>
    <rect class="button" x="26" y="414" width="210" height="44" rx="9"/>
    <text class="buttonText" x="65" y="442">Anforderung lesen</text>
    <text class="status" x="26" y="494">Bestätigung hier noch nicht verfügbar.</text>
    <text class="strong" x="26" y="526">Antworte im bestehenden Gespräch exakt mit:</text>
    <text class="link" x="26" y="560">Approval: UR</text>
  </g>

  <text class="section" x="615" y="520">PORTABLE MARKDOWN · VOLLSTÄNDIGER FALLBACK</text>
  <g transform="translate(615 540)">
    <rect class="markdown" width="545" height="600" rx="20"/>
    <text class="mdHeading" x="28" y="48">## Anmeldung verbessern</text>
    <text class="mdBody" x="28" y="84">**Aufgabe:** Ziel und Umfang klären</text>
    <text class="mdBody" x="28" y="112">**Fassung:** 2 · Entscheidung ausstehend</text>
    <text class="mdBody" x="28" y="154">### Haben wir deinen Wunsch</text>
    <text class="mdBody" x="28" y="180">richtig verstanden?</text>
    <text class="mdBody" x="28" y="222">- Ziel: klare Fehlermeldung</text>
    <text class="mdBody" x="28" y="250">- Im Umfang: Anmeldung</text>
    <text class="mdBody" x="28" y="278">- Außerhalb: Reset, Registrierung</text>
    <text class="mdBody" x="28" y="320">**Danach erlaubt:** System untersuchen</text>
    <text class="mdBody" x="28" y="348">**Noch gesperrt:** Umsetzung</text>
    <text class="mdBody" x="28" y="390">### Zulässige Antwort</text>
    <text class="monoStrong" x="28" y="426">`Approval: UR`</text>
    <text class="mdBody" x="28" y="474">### Bindung</text>
    <text class="mono" x="28" y="506">Run · Gate · Revision · Digest</text>
    <text class="mdBody" x="28" y="554">Fallback: MCP-App nicht bestätigt angezeigt</text>
  </g>

  <text class="footer" x="40" y="1192">Produkt-Mock v2 · die exakte Chat-Antwort wird nur gezeigt, wenn sie tatsächlich benötigt wird</text>
</svg>
